    <!-- MiSans Global is self-hosted; see scripts/sync-misans-fonts.mjs. Only the
         Latin base chunk is preloaded, and only at the two weights that carry
         first paint (400 body, 600 headings/controls). Every other chunk — the
         rest of Latin, and all of Chinese — is fetched on demand by
         unicode-range, so a Malay or English session never downloads a hanzi.
         The server rewrites this same file for the crawler shells, so these
         hints cover the public pages too. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/misans/latin/400/0.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/misans/latin/600/0.woff2" crossorigin />

    <meta name="google-site-verification" content="xU41Tg9iczk-VYjfB-zPPPZRleJbubDHwyONjicD7dM" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://dr-racing.com/" />
    <meta property="og:type" content="website" />

    <meta property="og:description" content="DR Racing — kedai motor & loan kedai di Simpang Ampat, Pulau Pinang. Senang lulus, tanpa slip gaji boleh cuba, CTOS/CCRIS boleh bincang." />
    <meta property="og:url" content="https://dr-racing.com/" />
    <meta property="og:locale" content="ms_MY" />
    <meta name="twitter:card" content="summary" />
    <!-- Google Analytics 4 — property 543646529, web stream G-WHP9Z6WX4Z.
         Two layers keep staff out of the numbers:
         1. Host gate — bo.dr-racing.com, App Hosting URLs and localhost serve
            this same shell, so only the public marketing hosts ever tag.
         2. Device opt-out — a staff device is remembered in localStorage and
            never sends a hit again, even while browsing the public site. It is
            set automatically the first time that device clicks a Staff link.
            The manual ?internal=1 / ?internal=0 switch was removed on
            2026-08-26: the owner decided excluding bo.dr-racing.com is enough,
            and no per-browser action should be required. Clear the
            dr_racing_internal_traffic localStorage key to undo a marking. -->
    <script>
      (function () {
        var MEASUREMENT_ID = 'G-WHP9Z6WX4Z';
        var INTERNAL_KEY = 'dr_racing_internal_traffic';
        var STAFF_ORIGIN = 'https://bo.dr-racing.com';

        var host = window.location.hostname;
        if (host !== 'dr-racing.com' && host !== 'www.dr-racing.com') {
          return;
        }

        // localStorage throws in private mode and when cookies are blocked.
        // A failure here must never break the page, and must never be read as
        // "this is not a staff device" in a way that starts tracking anyway —
        // so a read failure keeps the safest outcome for a real visitor
        // (tracked) while a write failure simply leaves nothing stored.
        function isInternalDevice() {
          try {
            return window.localStorage.getItem(INTERNAL_KEY) === '1';
          } catch (error) {
            return false;
          }
        }

        function setInternalDevice(value) {
          try {
            if (value) {
              window.localStorage.setItem(INTERNAL_KEY, '1');
            } else {
              window.localStorage.removeItem(INTERNAL_KEY);
            }
          } catch (error) {
            /* storage unavailable — nothing to persist */
          }
        }

        // Anyone who walks through the Staff door is staff. Capture phase and a
        // document-level listener so this also covers the server-rendered
        // crawler body and any link React mounts later.
        document.addEventListener('click', function (event) {
          var node = event.target;
          var link = node && node.closest ? node.closest('a[href^="' + STAFF_ORIGIN + '"]') : null;
          if (link) {
            setInternalDevice(true);
          }
        }, true);

        if (isInternalDevice()) {
          // Belt and braces: if any other script loads gtag.js on this page,
          // this flag stops it from sending anything for this stream.
          window['ga-disable-' + MEASUREMENT_ID] = true;
          return;
        }

        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', MEASUREMENT_ID);

        var tag = document.createElement('script');
        tag.async = true;
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + MEASUREMENT_ID;
        document.head.appendChild(tag);

        // Every public route (/, /stok/..., /blog/..., /kalkulator-ansuran-motor)
        // is a real document load today, so gtag's own page_view already covers
        // them. This keeps the counts correct if a public surface later navigates
        // through the History API instead of reloading.
        var lastUrl = window.location.pathname + window.location.search;
        function sendVirtualPageView() {
          var nextUrl = window.location.pathname + window.location.search;
          if (nextUrl === lastUrl) {
            return;
          }
          lastUrl = nextUrl;
          gtag('event', 'page_view', {
            page_location: window.location.href,
            page_path: nextUrl,
            page_title: document.title
          });
        }

        ['pushState', 'replaceState'].forEach(function (method) {
          var original = window.history[method];
          window.history[method] = function () {
            var result = original.apply(this, arguments);
            sendVirtualPageView();
            return result;
          };
        });
        window.addEventListener('popstate', sendVirtualPageView);

        // Key events. The business conversion is a customer opening WhatsApp,
        // and every WhatsApp CTA is a plain <a href> to wa.me / api.whatsapp.com
        // (shared/seoContent.mjs WHATSAPP_URL, the agent buttons, the crawler
        // shell body, the retired-intake page). One capture-phase listener on
        // the document covers the server-rendered HTML and anything React mounts
        // later, so no component has to remember to report its own click. It
        // never calls preventDefault: the link opens exactly as before, and
        // gtag sends the hit with sendBeacon so the navigation cannot drop it.
        // A link may carry data-cta="..." to name itself; otherwise the label
        // is the visible link text plus the nearest page landmark.
        var WHATSAPP_HOST = /^(?:wa\.me|api\.whatsapp\.com|web\.whatsapp\.com|(?:www\.)?whatsapp\.com)$/i;

        function textOf(node) {
          return String((node && node.textContent) || '').replace(/\s+/g, ' ').trim().slice(0, 80);
        }

        function landmarkOf(link) {
          var region = link.closest('header, nav, footer, aside, section, article, main');
          if (!region) {
            return 'page';
          }
          var name = region.id || String(region.className || '').split(/\s+/)[0] || '';
          return String(region.tagName || '').toLowerCase() + (name ? '#' + name : '');
        }

        document.addEventListener('click', function (event) {
          var node = event.target;
          var link = node && node.closest ? node.closest('a[href]') : null;
          if (!link || !WHATSAPP_HOST.test(String(link.hostname || ''))) {
            return;
          }
          gtag('event', 'whatsapp_click', {
            link_url: link.href,
            page_path: window.location.pathname,
            cta: link.getAttribute('data-cta') || textOf(link) || 'whatsapp',
            cta_location: landmarkOf(link),
            transport_type: 'beacon'
          });
        }, true);

        // Secondary signal: the first edit on the loan calculator, once per load.
        var calculatorUsed = false;
        document.addEventListener('change', function (event) {
          var field = event.target;
          if (calculatorUsed || !field || !/^calc-/.test(String(field.id || ''))) {
            return;
          }
          calculatorUsed = true;
          gtag('event', 'calculator_use', {
            page_path: window.location.pathname,
            field: field.id
          });
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
